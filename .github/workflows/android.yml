name: android

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Prepare resources
        run: |
          mkdir -p android/app/src/main/res/drawable
          cp bloque/assets/icon.png android/app/src/main/res/drawable/icon.png
          mkdir -p android/app/src/main/assets
          cp bloque/assets/icon.png android/app/src/main/assets/icon.png

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Blockys-Movil-1.1.0.apk

      - name: Publish mobile release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mobile-v1.1.0
          name: Blockys Móvil 1.1.0
          body: |
            Iniciador de Minecraft Java para Android.

            - Detecta PojavLauncher y lo abre con un toque.
            - Si falta, descarga su APK oficial desde GitHub y abre el instalador.
            - Al volver de instalar, abre el juego automáticamente.
            - Guía de cuenta Microsoft, controles e importación de instancias.

            PojavLauncher es un proyecto de PojavLauncherTeam y colaboradores, bajo GNU LGPL-3.0.
            Blockys Móvil no está afiliado ni respaldado por PojavLauncherTeam, Mojang Studios ni
            Microsoft, y no distribuye PojavLauncher: lo descarga desde su repositorio oficial.

            El APK tiene firma de depuración: instalalo con "Instalar apps desconocidas".
          files: Blockys-Movil-1.1.0.apk
          make_latest: false
